services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      interval: 60s

  backend:
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:5555:5555"
    environment:
      NODE_ENV: development
    volumes:
      - backend_node_modules:/app/backend/node_modules
      - ./backend/prisma:/app/backend/prisma:ro
      - ./project_files:/app/project_files

  app:
    ports:
      - "127.0.0.1:3001:80"

volumes:
  backend_node_modules:

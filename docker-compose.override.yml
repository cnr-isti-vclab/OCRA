services:
  postgres:
    ports:
      - "5432:5432"

  keycloak:
    image: keycloak/keycloak:26.1.4
    container_name: ocra-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import
      - keycloak_config:/opt/keycloak/data
    command: start-dev --import-realm
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/demo/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  mongodb:
    ports:
      - "27017:27017"
    healthcheck:
      interval: 60s

  backend:
    ports:
      - "3002:3002"
      - "5555:5555"
    environment:
      NODE_ENV: development
      # In Docker, backend must reach Keycloak via internal service name
      ISSUER: http://keycloak:8080/realms/demo
    volumes:
      - backend_node_modules:/app/backend/node_modules
      - ./backend/prisma:/app/backend/prisma:ro
      - ./project_files:/app/project_files

  app:
    ports:
      - "3001:80"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak_config:
  backend_node_modules:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ocra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oauth_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: ocra-mongodb
    environment:
      MONGO_INITDB_DATABASE: ocra_audit
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ocra-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/oauth_demo?schema=public}
      MONGO_URL: mongodb://ocra-mongodb:27017
      PORT: 3002
      SYS_ADMIN_EMAIL: ${SYS_ADMIN_EMAIL:-admin@ocra.it}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173,http://localhost:5174}
      NODE_ENV: ${NODE_ENV:-development}
      # OAuth Configuration
      ISSUER: ${ISSUER:-http://localhost:8081/realms/demo}
      CLIENT_ID: ${CLIENT_ID:-react-oauth}
      CLIENT_SECRET: ${CLIENT_SECRET}
    depends_on:
      - postgres
      - mongodb
    volumes:
      - project_files:/app/project_files

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ocra-frontend
    environment:
      PROVIDER_URL: ${PROVIDER_URL:-http://localhost:8081}
      REALM: ${REALM:-demo}
      ISSUER: ${ISSUER:-http://localhost:8081/realms/demo}
      CLIENT_ID: ${CLIENT_ID:-react-oauth}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3001}
      SCOPE: ${SCOPE:-openid profile email}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/oauth_demo?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  project_files:
  mongo_data:
  mongo_configdb:

# OCRA Docker Compose Configuration
#
# DEVELOPMENT (default):
#   docker compose up
#
# PRODUCTION:
#   1. Search for "PRODUCTION:" comments and uncomment those sections
#   2. Comment out the corresponding development settings (ports, etc.)
#   3. Create .env.prod with production values (see SIMPLE_PRODUCTION.md)
#   4. Deploy: docker compose --env-file .env.prod up -d --build
#
# TIP: Use git branches to keep dev/prod configs separate!
#      - main branch: development config
#      - production branch: all PRODUCTION sections uncommented

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ocra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oauth_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    # PRODUCTION: Comment out 'ports' above and uncomment 'networks' below
    # networks:
    #   - internal-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # PRODUCTION: Uncomment to auto-restart
    # restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ocra-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # PRODUCTION: Only uncomment KC_HOSTNAME if needed for your domain
      # KC_HOSTNAME: ${KC_HOSTNAME:-ocra.isti.cnr.it}
    ports:
      - "8081:8080"
    # PRODUCTION: Comment out 'ports' and uncomment below
    # expose:
    #   - "8080"
    # networks:
    #   - host-proxy-net
    #   - internal-net
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import
      - keycloak_config:/opt/keycloak/data
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  mongodb:
    image: mongo:8.0
    container_name: ocra-mongodb
    environment:
      MONGO_INITDB_DATABASE: ocra_audit
    ports:
      - "27017:27017"
    # PRODUCTION: Comment out 'ports' above and uncomment 'networks' below
    # networks:
    #   - internal-net
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    healthcheck:
      # Use the newer mongosh shell and allow extra start time for WiredTiger recovery
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # PRODUCTION: Uncomment to auto-restart
    # restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ocra-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/oauth_demo}
      PORT: 3002
      SYS_ADMIN_EMAIL: ${SYS_ADMIN_EMAIL:-admin@ocra.it}  # User with this email gets admin privileges on first login
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173,http://localhost:5174}
      # PRODUCTION: Set NODE_ENV=production in .env file
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3002:3002"
      - "5555:5555"  # Prisma Studio
    # PRODUCTION: Comment out 'ports' and uncomment below (no Prisma Studio in production)
    # expose:
    #   - "3002"
    # networks:
    #   - host-proxy-net
    #   - internal-net
    depends_on:
      - postgres
      - mongodb
    volumes:
      - backend_node_modules:/app/backend/node_modules  # Development: hot-reload support
      # PRODUCTION: Comment out backend_node_modules line above (not needed in production)
      - ./prisma:/app/backend/prisma:ro
      - project_files:/app/project_files
    # PRODUCTION: Uncomment to auto-restart
    # restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ocra-frontend
    environment:
      PROVIDER_URL: ${PROVIDER_URL:-http://localhost:8081}
      REALM: ${REALM:-demo}
      ISSUER: ${ISSUER:-http://localhost:8081/realms/demo}
      CLIENT_ID: ${CLIENT_ID:-react-oauth}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3001}
      SCOPE: ${SCOPE:-openid profile email}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3002}
      # Database connection for Prisma
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/oauth_demo}
    ports:
      - "3001:80"
    # PRODUCTION: Comment out 'ports' and uncomment below
    # expose:
    #   - "80"
    # networks:
    #   - host-proxy-net
    #   - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
    # PRODUCTION: Uncomment to auto-restart
    # restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules:
  project_files:
  mongo_data:
  mongo_configdb:
  keycloak_config:

# PRODUCTION: Uncomment networks section below
# networks:
#   host-proxy-net:
#     external: true
#     name: host-proxy-net  # Must exist on production server
#   internal-net:
#     driver: bridge

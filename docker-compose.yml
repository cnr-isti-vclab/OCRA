services:
  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ocra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oauth_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oauth_demo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ocra_net]

  # -------------------------
  # MongoDB (audit)
  # -------------------------
  mongodb:
    image: mongo:8.0
    container_name: ocra-mongodb
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    networks: [ocra_net]

  # -------------------------
  # Keycloak (OAuth Provider)
  # -------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: ocra-keycloak
    command: start-dev --http-port=8080 --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import
    networks: [ocra_net]

  # -------------------------
  # Backend API
  # -------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ocra-backend
    environment:
      PUBLIC_BASE_URL: "http://localhost:3001"
      # OAuth (INTERNAL docker DNS)
      ISSUER: http://keycloak:8080/realms/demo
      CLIENT_ID: react-oauth
      CLIENT_SECRET:

      # Backend
      PORT: 3002
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3001
      SYS_ADMIN_EMAIL: admin@ocra.it

      # DB
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oauth_demo?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/oauth_demo?schema=public

      # Mongo audit
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: ocra_audit
      MONGO_COLLECTION: audit

      # Assets
      PROJECT_FILES_PATH: /app/project_files

    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      keycloak:
        condition: service_started

    volumes:
      - project_files:/app/project_files
    ports:
      - "3002:3002"
    networks: [ocra_net]

  # -------------------------
  # Frontend (nginx)
  # -------------------------
  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ocra-frontend
    ports:
      - "3001:80"
    networks: [ocra_net]

volumes:
  postgres_data:
  mongo_data:
  mongo_configdb:
  project_files:

networks:
  ocra_net:
    driver: bridge

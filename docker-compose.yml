services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ocra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oauth_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ocra-mongodb
    hostname: mongodb
    command: ["sh", "/docker/mongo-start.sh"]
    environment:
      MONGO_INITDB_DATABASE: ocra_audit
      MONGO_REPLICA_SET_NAME: rs0
      MONGO_REPLICA_HOST: mongodb:27017
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
      - ./docker/mongo-init.js:/docker/mongo-init.js:ro
      - ./docker/mongo-start.sh:/docker/mongo-start.sh:ro
    networks:
      default:
        aliases:
          - mongodb
          - ocra-mongodb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.hello().setName === \"rs0\" && db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ocra-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/oauth_demo?schema=public}
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
      MONGO_AUDIT_DB: ${MONGO_AUDIT_DB:-ocra_audit}
      MONGO_CONTENT_DB: ${MONGO_CONTENT_DB:-ocra_content}
      PORT: 3002
      SYS_ADMIN_EMAIL: ${SYS_ADMIN_EMAIL:-admin@ocra.it}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      SWAGGER_PUBLIC_SERVER_URL: ${SWAGGER_PUBLIC_SERVER_URL:-}
      NODE_ENV: ${NODE_ENV:-development}
      # OAuth Configuration
      ISSUER: ${ISSUER:-http://localhost:8081/realms/demo}
      CLIENT_ID: ${CLIENT_ID:-react-oauth}
      CLIENT_SECRET: ${CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3002/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - project_files:/app/project_files

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ocra-frontend
    environment:
      PROVIDER_URL: ${PROVIDER_URL:-http://localhost:8081}
      REALM: ${REALM:-demo}
      ISSUER: ${ISSUER:-http://localhost:8081/realms/demo}
      CLIENT_ID: ${CLIENT_ID:-react-oauth}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3001}
      SCOPE: ${SCOPE:-openid profile email}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/oauth_demo?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  project_files:
  mongo_data:
  mongo_configdb:

server {
  listen 80;
  server_name _;

  # Allow larger file uploads (for 3D models, textures, etc.)
  client_max_body_size 100M;
  
  root /usr/share/nginx/html;
  index index.html;

  location /config.js {
    # Prevent caching of config.js - it's generated at runtime
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Proxy API requests to backend service
  location /api/ {
    proxy_pass http://backend:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }

  # Proxy OAuth requests to backend service
  location /oauth {
    proxy_pass http://backend:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }

  # Proxy Sessions requests to backend service
  location /sessions {
    proxy_pass http://backend:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }

  # Proxy Health check to backend service
  location /health {
    proxy_pass http://backend:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API documentation to backend service
  location /api-docs {
    proxy_pass http://backend:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Assets requests to backend service (project files, 3D models, etc.)
  # Only for project assets, not frontend static assets
  location /assets/projects {
    proxy_pass http://backend:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Don't buffer large files
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location / {
    # Don't cache index.html to ensure users get latest version
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "0";
      try_files $uri =404;
    }
    
    try_files $uri /index.html;
  }
}
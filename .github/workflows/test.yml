name: Backend Tests

on:
  push:
    # Run on all branches (allows testing on feature branches)
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    # PRs only to main/develop
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://ocra_user:ocra_pass@localhost:5432/ocra_test?schema=public
    
    # Service containers for databases
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
      
      - name: Create test role and database
        env:
          POSTGRES_ADMIN_PASSWORD: postgres
        run: bash scripts/bootstrap-test-db.sh
      
      - name: Apply Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_URL_TEST: ${{ env.TEST_DATABASE_URL }}
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Build backend
        working-directory: backend
        run: npm run build
      
      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_URL_TEST: ${{ env.TEST_DATABASE_URL }}
          MONGO_URL: mongodb://localhost:27017
          MONGO_AUDIT_DB: ocra_audit_test
          MONGO_CONTENT_DB: ocra_content_test
        run: |
          npm run test:integration
      
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** backend TypeScript build" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests:** backend integration suite under backend/src/test" >> $GITHUB_STEP_SUMMARY
